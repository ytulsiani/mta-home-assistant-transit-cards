# ── Lovelace resource (add once in Settings → Dashboards → Resources) ──────────
# URL:  /local/mta-transit-card.js
# Type: JavaScript module

# ── Example card config ─────────────────────────────────────────────────────────
type: custom:mta-transit-card

# Base URL of your transit API (no trailing slash)
api_url: http://192.168.1.100:8000

# The metro_id you register in METROS in main.py (e.g. "mta", "nyct")
metro_id: mta

# How often to refresh in seconds (default: 30)
refresh_seconds: 30

# How many upcoming arrivals to show per route (default: 3)
predictions_per_route: 3

stops:
  - stop_id: "640"           # GTFS stop ID for 86 St (4/5/6)
    stop_name: "86 St"
    type: subway
    routes:
      - route_id: "4"
        direction: 1         # 0 = uptown/first direction, 1 = downtown/second direction
      - route_id: "5"
        direction: 1
      - route_id: "6"
        direction: 1

  - stop_id: "R29"           # Example: Times Sq–42 St (N/Q/R/W)
    stop_name: "Times Sq–42 St"
    type: subway
    routes:
      - route_id: "N"
        direction: 1
        headsign: "Downtown"   # optional fallback if API returns no headsign
      - route_id: "Q"
        direction: 1
      - route_id: "R"
        direction: 1

  - stop_id: "400769"        # BusTime stop ID
    stop_name: "86 St & Lexington Av"
    type: bus
    routes:
      - route_id: "M86-SBS"
        direction: 0
      - route_id: "M15-SBS"
        direction: 1
